# This is a config file for the Sail generated from ARM-ASL

pc = "_PC"

comment_prefixes = ["@", "//"]

translation_function = "AArch64_TranslateAddress"

# TODO: BS: implement in isla-axiomatic properly...
# bit to set to inject an interrupt.
interrupt_status_bit = "ISR_EL1.I"

in_program_order = ["sail_barrier", "sail_cache_op", "sail_take_exception", "sail_return_exception", "sail_tlbi", "sail_system_register_write"]

# litmus variables have type uint32_t by default
default_sizeof = 4

# The assembler is used for assembling the code in litmus tests. We
# assume it takes arguments like GNU as.
[[toolchain]]
name = "macos-aarch64"
os = "macos"
arch = "aarch64"
assembler = "as -march=armv8.3-a --target=aarch64-unknown-linux-gnu"
objdump = "/opt/homebrew/opt/llvm/bin/llvm-objdump"
nm = "/opt/homebrew/opt/llvm/bin/llvm-nm"
linker = "/opt/homebrew/bin/ld.lld"

[[toolchain]]
name = "default"
assembler = "aarch64-linux-gnu-as -march=armv8.3-a"
objdump = "aarch64-linux-gnu-objdump"
nm = "aarch64-linux-gnu-nm"
linker = "aarch64-linux-gnu-ld"

[mmu]
page_table_base = "0x300000"
page_size = "4096"
s2_page_table_base = "0x200000"
s2_page_size = "4096"

# This section contains the base address for loading the code for each
# thread in a litmus test, and the stride which is the distance
# between each thread in bytes. The overall range for thread memory is
# the half-open range [base,top)"
[threads]
base = "0x400000"
top = "0x500000"
stride = "0x1000"

# If we want to give symbolic addresses concrete values, then we start
# with a base address and increment by stride for each new symbolic
# address.
[symbolic_addrs]
base = "0x600000"
top = "0x700000"
stride = "0x10"

[registers]
ignore = [
  "_PC",
  # SEE must NOT be ignored: it is the pseudo-register the ASL decode uses
  # for "SEE <other encoding>" redirects. With "__isla_continue_on_see"
  # restored below, leaving SEE tracked is the known-good setting that the
  # earlier Sailor runs relied on. Ignoring it (the previous revision) can
  # turn benign SEE redirects into premature stops/throws.
  #"SEE",
  "InGuardedPage",
  "__trickbox_enabled",
  "v8Ap1_IMPLEMENTED",
  "v8Ap2_IMPLEMENTED",
  "v8Ap3_IMPLEMENTED",
  "v8Ap4_IMPLEMENTED",
  "v8Ap5_IMPLEMENTED",
  "v8Ap6_IMPLEMENTED",
  "v8Ap7_IMPLEMENTED",
  "v8Ap8_IMPLEMENTED",
  "v8Ap9_IMPLEMENTED",
  "v9Ap0_IMPLEMENTED",
  "v9Ap1_IMPLEMENTED",
  "v9Ap2_IMPLEMENTED",
  "v9Ap3_IMPLEMENTED",
  "v9Ap4_IMPLEMENTED",
  "__isla_vector_gpr",
  "__monomorphize_writes",
  "__monomorphize_reads",
]

# These registers are set before any symbolic execution occurs
[registers.defaults]
"__isla_vector_gpr" = false
# Restored: continue past SEE redirects during decode. The earlier config
# noted "This changes everything for the parse analyser of sailor"; the
# subsequent revision disabled it, which can reintroduce SEE-related
# stops/throws on aliased encodings. Keep it on for the batch runs.
"__isla_continue_on_see" = true
"__monomorphize_reads" = false
"__monomorphize_writes" = false
# --- MAXIMIZE-EXPLORATION PASS -------------------------------------------
# VBAR_EL1/EL2, CNTCR, MDSCR_EL1 and the four external debug-authentication
# signals (DBGEN/NIDEN/SPIDEN/SPNIDEN) are architectural system registers /
# signals, not part of the minimal "walk must resolve" set (TTBR*, TCR*,
# MAIR*, SCTLR_EL1/EL2 whole-register). They are intentionally left UNPINNED
# here so the
# solver treats them as symbolic and the batch run explores more of the
# state space through them (e.g. debug-entry traps, exception-vector
# choices, watchpoint/debug-register gated paths). Expect this to surface
# more EXEC_ERR/throw diversity on paths that previously took the pinned
# "no debugger, no async counter tick" branch -- that diversity is the
# point of this pass. Re-pin individually here if a specific instruction
# class needs to be pulled back to a single deterministic path.
"InGuardedPage" = false
"__highest_el_aarch32" = false
"__CNTControlBase" = "0x00000000000000"
"__supported_pa_size" = 52
"__supported_va_size" = 52
"__max_implemented_smeveclen" = 512
# --- MAXIMIZE-EXPLORATION PASS -------------------------------------------
# HCR_EL2, TCR_EL3, SCR_EL3, HCRX_EL2, every HFG*TR*_EL2/HFG*TR2_EL2
# fine-grained-trap register, _EDSCR, MDCR_EL3, SCTLR_EL3, SMCR_EL3,
# ZCR_EL3, CPTR_EL2/EL3, CPACR_EL1, all the CNT*_CTL_* counter-control
# registers, MPAMIDR_EL1, GPCCR_EL3, CTIDEVCTL, MDCR_EL2, PMCR_EL0, _HDCR
# and _PMCR used to be pinned here to force every instruction onto one
# fixed "no traps, no counters, no PMU" path. They are now left UNPINNED
# so the solver explores the full trap/enable state space each of them
# controls (FP/SIMD access traps, GCS/PIE/AIE/FGT routing, debug and
# performance-monitor gating, SVE/SME EL3 traps, counter behaviour).
#
# TCR_EL1/TCR_EL2, MAIR_EL1/MAIR_EL2, TTBR0_NS/HTTBR/_TTBR0_EL1/_TTBR0_EL2,
# TTBR1_NS/_TTBR1_EL1 and SCTLR_EL1/SCTLR_EL2 (whole-register) remain pinned in
# [registers.reset] below -- they are the minimal set needed for the
# stage-1 identity-mapped walk installed by --mmu-on to actually resolve;
# without them every load/store would fault before reaching interesting
# system-register state instead of after it.
"CFG_RMR_AA64" = "0b1"
"CFG_RVBAR" = "0x0000000010300000"
"CFG_ID_AA64PFR0_EL1_EL3" = "0x1"
"CFG_ID_AA64PFR0_EL1_EL2" = "0x1"
"CFG_ID_AA64PFR0_EL1_EL1" = "0x1"
"CFG_ID_AA64PFR0_EL1_EL0" = "0x1"
# Need to investigate BTI extension. Guard pages cause problems with
# memory accesses.
#
# Architecture-version chain. The upstream config ships with everything
# above v8.1 disabled, which makes every version-gated decode clause fall
# through to the __DecodeA64_* catch-alls in decode_end.sail
# (Error_Undefined at all four ELs) even though the instruction exists in
# the model. Enable the full v9.4 chain; individually problematic
# features (MTE, BTI, LSE2, TME, SPE, PMU, ...) remain pinned off via
# their FEAT_*_IMPLEMENTED overrides below, which take precedence for
# IsFeatureImplemented() checks. If enabling the chain noticeably
# increases path counts for some instruction class, disable versions
# selectively rather than reverting wholesale.
"v8Ap1_IMPLEMENTED" = true
"v8Ap2_IMPLEMENTED" = true
"v8Ap3_IMPLEMENTED" = true
"v8Ap4_IMPLEMENTED" = true
"v8Ap5_IMPLEMENTED" = true
"v8Ap6_IMPLEMENTED" = true
"v8Ap7_IMPLEMENTED" = true
"v8Ap8_IMPLEMENTED" = true
"v8Ap9_IMPLEMENTED" = true
"v9Ap0_IMPLEMENTED" = true
"v9Ap1_IMPLEMENTED" = true
"v9Ap2_IMPLEMENTED" = true
"v9Ap3_IMPLEMENTED" = true
"v9Ap4_IMPLEMENTED" = true
"__unpred_tsize_aborts" = true
# Trickbox has various features for debugging spec and running tests
"__trickbox_enabled" = false
"__tlb_enabled" = false

# Synchronous external-abort trickbox flags.
#
# Footprint analysis does not model external aborts. With the MMU disabled
# (SCTLR_ELx.M = 0) every data access is Device-nGnRnE, so the read-side
# flags below cause a synchronous external abort on ordinary loads, which
# routes through EndOfInstruction -> Error_ExceptionTaken at
# builtins.sail:52 - the same throw site as the (now-fixed) FP traps and
# the alignment forks. Turn the read/TTW/SO/prefetch side OFF so loads
# complete cleanly. (The write-side flags were already off.) Re-enable
# only if you specifically want to model external aborts.
"__syncAbortOnTTWNonCache" = false
"__syncAbortOnTTWCache" = false
"__syncAbortOnSoWrite" = false
"__syncAbortOnSoRead" = false
"__syncAbortOnReadNormNonCache" = false
"__syncAbortOnReadNormCache" = false
"__syncAbortOnPrefetch" = false
"__syncAbortOnDeviceRead" = false
"__mte_implemented" = "0b0000"
"FEAT_BRBEv1p1_IMPLEMENTED" = false
"FEAT_RME_IMPLEMENTED" = false
"FEAT_BRBE_IMPLEMENTED" = false
"__empam_force_ns_implemented" = false
"__empam_sdeflt_implemented" = false
"__empam_tidr_implemented" = false
"FEAT_CONSTPACFIELD_IMPLEMENTED" = false
"FEAT_PACQARMA3_IMPLEMENTED" = false
"FEAT_SME_IMPLEMENTED" = false
"__mpam_has_hcr" = true
"__mpam_has_altsp" = true
#"__vmid16_implemented" = true
"FEAT_PAN_IMPLEMENTED" = true
"FEAT_FP16_IMPLEMENTED" = true
"FEAT_DotProd_IMPLEMENTED" = true
"FEAT_CRC32_IMPLEMENTED" = true
"FEAT_AA32HPD_IMPLEMENTED" = true
"FEAT_AES_IMPLEMENTED" = true
"FEAT_PMULL_IMPLEMENTED" = true
"FEAT_SHA256_IMPLEMENTED" = true
"FEAT_SHA1_IMPLEMENTED" = true
"__syncAbortOnWriteNormNonCache" = false
"__syncAbortOnWriteNormCache" = false
"__syncAbortOnDeviceWrite" = false
"FEAT_MPAM_IMPLEMENTED" = false
"FEAT_SM4_IMPLEMENTED" = false
"FEAT_SM3_IMPLEMENTED" = false
"FEAT_SHA512_IMPLEMENTED" = false
"FEAT_SHA3_IMPLEMENTED" = false
"FEAT_LS64_V_IMPLEMENTED" = true
"FEAT_LS64_ACCDATA_IMPLEMENTED" = true
"FEAT_DoPD_IMPLEMENTED" = false

# Explicitly enable the base-ISA extensions exercised by the ARM-JSON
# batch runs. These FEAT_* registers already default to true inside the
# model (see `register FEAT_* : bool = true` declarations in
# arm-v9.4-a/src/v8_base.sail); they are listed here to make the
# configuration explicit and stable across model rebuilds.
"FEAT_MOPS_IMPLEMENTED" = true      # SETP/SETM/SETE + CPY* (memcms)
"FEAT_RPRFM_IMPLEMENTED" = true     # RPRFM range prefetch
"FEAT_LRCPC_IMPLEMENTED" = true     # LDAPR*
"FEAT_LRCPC2_IMPLEMENTED" = true    # LDAPUR*/STLUR*
"FEAT_LRCPC3_IMPLEMENTED" = true    # LDIAPP/STILP, LDAPR/STLR writeback
"FEAT_LS64_IMPLEMENTED" = true      # LD64B/ST64B/ST64BV (with LS64_V/ACCDATA above)
"FEAT_FlagM_IMPLEMENTED" = true     # CFINV/RMIF/SETF8/SETF16
"FEAT_FlagM2_IMPLEMENTED" = true    # AXFLAG/XAFLAG
"FEAT_HBC_IMPLEMENTED" = true       # BC.cond
"FEAT_CHK_IMPLEMENTED" = true       # CHKFEAT
"FEAT_CSSC_IMPLEMENTED" = true      # ABS/CNT/CTZ/SMAX/SMIN/UMAX/UMIN
"FEAT_WFxT_IMPLEMENTED" = true      # WFET/WFIT

# EDESR/EDECR (external debug status/control) left unpinned for the same
# maximize-exploration reason as the debug-authentication signals above.

# Avoid some extra complication
"FEAT_TME_IMPLEMENTED" = false
# As an alternative to the below, you could abstract the SPEBranch and
# BRBEBranch functions.
"FEAT_SPE_IMPLEMENTED" = false
"FEAT_SPEv1p1_IMPLEMENTED" = false
"FEAT_SPEv1p2_IMPLEMENTED" = false
"FEAT_SPEv1p3_IMPLEMENTED" = false
"FEAT_SPEv1p4_IMPLEMENTED" = false
"FEAT_PMUv3_IMPLEMENTED" = false

# LSE2 turns load/store-pair instructions on a 16-byte boundary
# into single-copy-atomic updates.
# this is unncessary branching in the footprint analysis
"FEAT_LSE2_IMPLEMENTED" = false

# BTI guards branches, maybe generating kinds of errors
# this causes unncessary branching during footprint analysis.
"FEAT_BTI_IMPLEMENTED" = false

# memory tagging
# this causes highly-symbolic addresses to go haywire
# with spurious aborts during footprint analysis
#
# Kept OFF deliberately: with these false, the MTE tag-arithmetic
# instructions (ADDG/SUBG/GMI/IRG/SUBP/SUBPS, STG*/LDG) throw
# Error_Undefined at their HaveMTEExt() decode gate at every EL -
# filter them out of the batch run instead (see the Rust-side filter).
# Flip both to true (and set __mte_implemented above to e.g. "0b0010")
# only if you accept the path explosion on symbolic addresses.
"FEAT_MTE_IMPLEMENTED" = false
"FEAT_MTE2_IMPLEMENTED" = false

"SPESampleInFlight" = false

"__g1_activity_monitor_implemented" = "0x0000"
"__g1_activity_monitor_offset_implemented" = "0x0000"

# These registers are set during symbolic execution by the special builtin "reset_registers"
[registers.reset]
# MMU-ON build (differs from armv9p4.toml only in this reset block).
# Bit 0  (M)  set    -> stage-1 MMU enabled at EL1 (this is the whole point:
#                       loads/stores now perform a real page-table walk and
#                       READ TTBR0_EL1 / MAIR_EL1 / the descriptors, which is
#                       what surfaces the translation registers in the
#                       per-instruction footprints and fixes the *->EL0
#                       TTBR0_EL1/TTBR1_EL1/MAIR_EL1 false negatives).
# Bit 1  (A)  unset  -> allows unaligned accesses
# Bit 2  (C)  set    -> data accesses cacheable (Normal memory)
# Bit 9  (UMA) set  -> EL0 may MRS/MSR DAIF (User Mask Access). WITHOUT this,
#                      MRS/MSR DAIF at EL0 traps to EL1, so the sweep records
#                      DAIF as "Not allowed (exception)" at EL0 and DAIF wrongly
#                      drops out of every *->EL0 set. The MMU-off config had
#                      UMA set (0x04000200); the MMU-on value must keep bit 9.
# Bit 23 (SPAN)      -> PSTATE.PAN unchanged on exception entry
# Bit 26 (UCI) set   -> cache-maintenance ops allowed at EL0
#
# --- MAXIMIZE-EXPLORATION PASS (reverted for SCTLR_EL1/EL2) --------------
# Attempted "REG.field"-only pins here (SCTLR_EL1.M / .C etc.) to leave every
# other control bit (A, UMA, SPAN, UCI, WXN, SA, ITD, ...) symbolic while
# fixing only M/C. That relies on the reset builtin updating a single field
# of an ALREADY-STRUCTURED register value; SCTLR_EL1/EL2 never get a full
# default value asserted anywhere else in this config (unlike PSTATE, which
# does), so the field-only reset write hits an uninitialized/non-struct
# register and panics in isla-lib's executor ("Invalid field assignment" at
# executor.rs:578). Reverted to full whole-register concrete pins, the
# mechanism actually supported here. This means A/UMA/SPAN/UCI etc. are
# fixed again (not part of the exploration for now) -- partial-bit
# exploration of SCTLR_ELx would need isla-lib support for field resets on
# registers without a pre-existing full value, not just a config change.
"SCTLR_EL1" = "{ bits = 0x0000000004800205 }"
# EL2 stage-1 MMU on as well (M=1,C=1) so EL2 runs walk and read TTBR0_EL2
# (via HTTBR). EL3 is deliberately left flat (SCTLR_EL3.M=0): EL3 can MRS every
# register directly, so it needs no walk-based footprint enrichment.
"SCTLR_EL2" = "{ bits = 0x0000000000000005 }"

# CPACR_EL1, CPTR_EL2/EL3, CNTCR, CNTHP_CTL_EL2, MDCR_EL2, the external
# debug-authentication signals (DBGEN/NIDEN/SPIDEN/SPNIDEN), SCR_EL3,
# HCRX_EL2, HCR_EL2, every HFG*TR*_EL2 / HFG*TR2_EL2 fine-grained-trap
# register, _EDSCR, MDCR_EL3 and VTCR_EL2 used to be re-pinned here (the
# model's reset clobbers [registers.defaults], so they were repeated). They
# are now left UNPINNED for the same maximize-exploration reason given in
# [registers.defaults] above: freeing them lets the solver explore the
# FP/SIMD-trap, GCS/PIE/AIE/FGT-routing, debug-entry and stage-2 corners
# that were previously collapsed onto one fixed value.

"PSTATE.nRW" = "0b0"
# NOTE: PSTATE.{D,SS,A,I,F} are pinned in footprint.rs (local_reset_registers),
# the only place that binds PSTATE fields for the per-EL runs, so they are NOT
# set here. The earlier "PSTATE.D"/"PSTATE.SS" lines were removed as redundant.
# PSTATE.nRW itself stays pinned (0b0 = AArch64): freeing it would let the
# executor wander into the separate AArch32 decode tree, which this harness
# and its A64-only instruction filter are not built to interpret.

# ---------------------------------------------------------------------------
# Stage-1 translation setup (MMU-on). HCR_EL2.VM is left 0 above, so EL0/EL1
# use stage-1 only -> a SINGLE set of tables at 0x300000 is enough and no
# stage-2 (VTTBR) tables are required. (Trade-off: VTTBR_EL2 / VTCR_EL2 will
# not appear as indirect channels in this run. To capture them, set
# HCR_EL2 = 0x...80000001 and provide stage-2 tables at s2_page_table_base.)
#
# TCR_EL2: T0SZ = 0x10 (16) -> 48-bit VA, 4KB granule (TG0=0b00), EPD0=0
# (TTBR0 walks enabled). Matches the 4-level / L1-1GB-block walk that the
# harness's identity table services.
#
# TCR_EL1 ALSO enables the TTBR1 (high) half so --high-va-probe can make the
# stage-1 walk read TTBR1_EL1 (Step 5 / surfacing TTBR1_EL1 as an EL*->EL0
# channel). Field layout of 0x0000000080100010:
#   T0SZ  [5:0]   = 0x10 (16)  -> 48-bit low (TTBR0) VA
#   EPD0  [7]     = 0          -> TTBR0 walks enabled
#   TG0   [15:14] = 0b00       -> 4KB granule (TTBR0)
#   T1SZ  [21:16] = 0x10 (16)  -> 48-bit high (TTBR1) VA   <-- added (was 0=invalid)
#   EPD1  [23]    = 0          -> TTBR1 walks enabled       <-- required for the probe
#   TG1   [31:30] = 0b10       -> 4KB granule (TTBR1; note TG1 encoding != TG0)
# Without T1SZ set to a legal value the TTBR1 walk faults before reading the
# base, and the parser discards the faulting pass -> TTBR1_EL1 never surfaces.
# TCR_EL2 keeps only the TTBR0 half: with HCR_EL2.E2H=0 the EL2 regime has no
# TTBR1_EL2, so the high-VA probe is meaningful at EL0/EL1 only.
"TCR_EL1" = "{ bits = 0x0000000080100010 }"
"TCR_EL2" = "{ bits = 0x0000000080000010 }"

# MAIR Attr0 = 0xFF -> Normal, Inner/Outer Write-Back non-transient RW-alloc.
# The --mmu-on block descriptor uses AttrIndx=0, so Attr0 MUST be Normal or
# every translated access becomes Device (alignment/ordering forks). Keep in
# lockstep with footprint.rs.
"MAIR_EL1" = "{ bits = 0xffffffffffffffff }"
"MAIR_EL2" = "{ bits = 0xffffffffffffffff }"

# MAIR2 (FEAT_AIE extended attribute indices 8..15) is left UNPINNED
# (maximize-exploration): the block descriptor's AttrIndx=0 only ever
# consults MAIR_EL1/EL2 Attr0 (pinned above), so MAIR2_EL1/EL2 do not
# affect walk resolution -- they're free to vary and are no longer part
# of the minimal walk-critical set.

# TTBR0 must resolve to the L0 table base the harness installs (0x300000).
# Armv9 quirk (same as the stock isla ARM config): the architectural 64-bit
# TTBR0_NS / HTTBR take primacy, while the 128-bit _TTBR0_EL{1,2} are zeroed so
# isla zero-extends the upper half on read.
"TTBR0_NS"   = "{ bits = 0x0000000000300000 }"
"HTTBR"      = "{ bits = 0x0000000000300000 }"
"_TTBR0_EL1" = "{ bits = 0x00000000000000000000000000000000 }"
"_TTBR0_EL2" = "{ bits = 0x00000000000000000000000000000000 }"

# TTBR1 (high half) for --high-va-probe. It points at the SAME identity root
# (0x300000) as TTBR0: with T1SZ=16 the TTBR1 walk indexes on VA bits[47:0], so
# a high probe VA 0xFFFF_0000_0060_0000 (bits[63:48] all 1 -> selects TTBR1)
# walks on 0x0000_0000_0060_0000 and resolves to the SAME leaf the builder
# already created for 0x600000. So the walk completes cleanly AND emits the
# TTBR1_EL1 read we want, with no separate high-half table needed. (A real OS
# would use a distinct kernel table here; sharing the root is the minimal setup
# that surfaces the register.) Same NS/_EL1 primacy quirk as TTBR0 above.
#
# NOTE(verify-on-isla): if the builder maps ONLY the single 0x600000 page (not a
# 1GB block), confirm the high probe still resolves; otherwise widen the setup
# string (e.g. add `identity 0xFFFF000000600000;`) or map at a larger level.
"TTBR1_NS"   = "{ bits = 0x0000000000300000 }"
"_TTBR1_EL1" = "{ bits = 0x00000000000000000000000000000000 }"

# Concretize page-table descriptors when the walker reads them (the harness
# writes them as concrete bytes, but this also collapses any residual fork on
# the walk path).
"__monomorphize_descriptors" = true

